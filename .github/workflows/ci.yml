name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install -e . -e services/api

      - name: Test deterministic engine and API workflow
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Test API service
        run: PYTHONPATH=src:services/api python3 -m unittest discover -s services/api/tests -v

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test web application
        working-directory: apps/web
        run: npm test -- --run

      - name: Typecheck web application
        working-directory: apps/web
        run: npm run typecheck

      - name: Build web application
        working-directory: apps/web
        run: npm run build

      - name: Reject high or critical dependency vulnerabilities
        working-directory: apps/web
        run: npm audit --audit-level=high
